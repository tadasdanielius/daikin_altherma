name: HassFest-Validate

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      note:
        description: 'Note'

jobs:
  validate:
    runs-on: "ubuntu-latest"
    steps:
        - uses: "actions/checkout@v2"
        - uses: "home-assistant/actions/hassfest@master"