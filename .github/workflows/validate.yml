name: HACS-Validate

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      note:
        description: 'Note'

jobs:
  validate:
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"
          # Contributor forks may have no topics and a disabled issue tracker.
          ignore: ${{ github.event_name == 'push' && github.event.repository.fork && 'issues topics' || '' }}
